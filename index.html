<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Steady</title>
<meta name="description" content="A quiet, local-first habit tracker. Keep your word to yourself.">
<meta name="theme-color" content="#0f1a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steady">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --font-system:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-rounded:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --font-serif:ui-serif,"Iowan Old Style","Palatino","Georgia",serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:var(--font-system);
  --fs:16px; --r:18px; --r-sm:12px; --r-pill:999px; --gap:14px; --pad:16px;
  --dur:.22s; --ease:cubic-bezier(.2,.8,.2,1);
  --tabbar:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.45;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--fg2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
[hidden]{display:none!important}
.reduce *{transition:none!important;animation:none!important}

#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) var(--pad) calc(var(--tabbar) + env(safe-area-inset-bottom) + 24px);min-height:100dvh}
.page{animation:pagein var(--dur) var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
.head h1{font-size:2rem;line-height:1.1}
.head .eyebrow{font-size:.9rem;color:var(--fg2);margin-bottom:2px}
.headpills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.headpills .pill{padding:6px 10px;font-size:.82rem}
.pill.coins{color:var(--accent);background:var(--accent-soft);border-color:transparent;transition:transform .12s}
.pill.coins:active{transform:scale(.94)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.card+.card,.card+.section,.section+.card,.section+.section{margin-top:var(--gap)}
.section h2{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section h2 .muted{font-weight:500;font-size:.85rem}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-pill);background:var(--surface2);border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);font-weight:650;background:var(--surface2);border:1px solid var(--line);transition:transform .12s var(--ease),background var(--dur),opacity var(--dur);min-height:44px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:var(--glow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:8px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}

input[type=text],input[type=search],textarea{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface2);outline:none;transition:border-color var(--dur),box-shadow var(--dur)}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Today ring */
.ring-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .track{stroke:var(--surface2)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .7s var(--ease);filter:var(--glow-f)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .center b{font-size:1.7rem;font-weight:700;letter-spacing:-.03em}
.ring .center span{display:block;font-size:.72rem;color:var(--fg2);margin-top:5px}
.ring-meta h3{font-size:1.15rem;margin-bottom:4px}
.affline{margin:10px 4px 0;text-align:center;font-style:italic;color:var(--fg2);font-size:.95rem;line-height:1.45}
.whisper{font-style:italic;color:var(--fg2);font-size:.92rem;margin:14px 2px 4px;text-wrap:balance}

/* Task list */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);transition:border-color var(--dur),background var(--dur),transform var(--dur),opacity var(--dur);text-align:left;width:100%}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--fg3);display:grid;place-items:center;flex:none;transition:all var(--dur)}
.task .box svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all var(--dur)}
.task.selected{border-color:var(--accent);background:var(--accent-soft)}
.task.selected .box{border-color:var(--accent);background:var(--accent)}
.task.selected .box svg{opacity:1;transform:none;color:var(--accent-fg)}
.task .name{font-weight:600;flex:1}
.task .val{color:var(--fg2);font-size:.82rem;font-weight:600}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:var(--r-pill);background:var(--surface2);color:var(--fg2);font-size:.7rem;font-weight:600;vertical-align:middle}
.timerow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.timerow .chip{padding:7px 12px;font-size:.85rem}
.otval{color:var(--accent);font-weight:700}
input[type=number]{border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface2);outline:none}
input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task .str{display:block;height:3px;border-radius:3px;background:var(--surface2);margin-top:6px;width:120px;overflow:hidden}
.task .str i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dots.big{gap:6px}.dots.big i{width:14px;height:14px;border-radius:4px}.dots i.t{border:2px solid var(--accent);background:transparent}.dots i.f{background:var(--fg3)}
.task.done{opacity:.6}
.task.done .box{border-color:var(--accent);background:var(--accent)}
.task.done .box svg{opacity:1;transform:none;color:var(--accent-fg)}
.task.done .name{text-decoration:line-through;text-decoration-color:var(--fg3)}
.task.leaving{opacity:0;transform:translateX(30px) scale(.97)}
.task.dense{padding:10px 12px}

.confirm-bar{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 10px);width:min(92vw,480px);z-index:20;opacity:0;pointer-events:none;transition:all var(--dur) var(--ease)}
.confirm-bar.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.confirm-bar .btn{width:100%;padding:15px;border-radius:16px;font-size:1.02rem}

details.fold{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--fg2);font-size:.9rem;padding:6px 0}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"›";font-size:1.2rem;transition:transform var(--dur)}
details.fold[open] summary::after{transform:rotate(90deg)}

.empty{text-align:center;padding:28px 12px;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}

/* Tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;pointer-events:none}
.tabbar nav{pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);width:min(100%,480px);background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;padding:6px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tabbar .ind{position:absolute;top:6px;bottom:6px;width:calc(20% - 2.4px);left:6px;border-radius:20px;background:var(--accent-soft);transition:transform .28s var(--ease)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:20px;color:var(--fg2);font-size:.7rem;font-weight:600;transition:color var(--dur)}
.tabbar button svg{width:21px;height:21px}
.tabbar button{font-size:.66rem}
.tabbar button.active{color:var(--accent)}

/* Sheets, toasts, overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity var(--dur)}
.overlay.show{opacity:1}
.sheet{width:min(100%,520px);max-height:88dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 20px);transform:translateY(40px);transition:transform .3s var(--ease);border:1px solid var(--line);border-bottom:0}
.overlay.show .sheet{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--fg3);margin:4px auto 16px}
.sheet h2{font-size:1.3rem;margin-bottom:6px}
.sheet .foot{display:flex;gap:10px;margin-top:18px}
.sheet .foot .btn{flex:1}
.modal{width:min(92vw,400px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:40vh;transform:scale(.96);transition:transform var(--dur) var(--ease)}
.overlay.center{align-items:center}
.overlay.show .modal{transform:none}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px);pointer-events:none;z-index:50;background:var(--fg);color:var(--bg);padding:12px 14px 12px 18px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transition:all var(--dur) var(--ease);font-weight:600;font-size:.92rem;max-width:92vw;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
body.has-confirm .toast{bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 84px)}
.toast button{color:var(--accent-on-dark);font-weight:700;padding:6px 8px;border-radius:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface2);font-size:.88rem;font-weight:600;transition:all var(--dur)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip.add{border-style:dashed;color:var(--fg2)}

/* Gate screens */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px 28px calc(env(safe-area-inset-bottom) + 28px);max-width:520px;margin:0 auto}
.gate .q{font-size:1.65rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.gate .q::before{content:"“";color:var(--accent);font-size:2.5rem;line-height:0;vertical-align:-.2em;margin-right:2px}
.gate .by{margin-top:16px;color:var(--fg2)}
.gate .actions{margin-top:40px}
.gate.onb{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 60px)}
.gate.onb h1{font-size:2.1rem;line-height:1.15;margin-bottom:14px}
.gate.onb p{color:var(--fg2);font-size:1.05rem;max-width:36ch}
.gate .steps{display:flex;gap:6px;margin-bottom:28px}
.gate .steps i{width:22px;height:4px;border-radius:4px;background:var(--surface2)}
.gate .steps i.on{background:var(--accent)}

/* Progress */
.weekchart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;padding-top:6px}
.weekchart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekchart .bar{width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px;transition:height .5s var(--ease);opacity:.9}
.weekchart .bar.zero{background:var(--surface2)}
.weekchart .bar.future{background:transparent;border:1px dashed var(--line)}
.weekchart .n{font-size:.75rem;color:var(--fg2);font-weight:600}
.weekchart .col.today .n{color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .dow{font-size:.7rem;color:var(--fg2);text-align:center;font-weight:600}
.heat .cell{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--fg2);border:1px solid transparent;transition:transform .12s}
.heat .cell:active{transform:scale(.92)}
.heat .cell.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface2));color:var(--fg)}
.heat .cell.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface2));color:var(--fg)}
.heat .cell.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface2));color:var(--accent-fg)}
.heat .cell.l4{background:var(--accent);color:var(--accent-fg)}
.heat .cell.today{border-color:var(--fg)}
.heat .cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.heat .cell.future{opacity:.35}
.heat .cell.note::after{content:"";position:absolute}
.heat .cell{position:relative}
.heat .cell.hasnote::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;position:absolute;bottom:3px;right:4px;opacity:.7}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--fg2);transition:all var(--dur)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:12px;border-radius:var(--r-sm);background:var(--surface2)}
.stat b{display:block;font-size:1.45rem;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:.8rem;color:var(--fg2)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.list li:first-child{border-top:0;padding-top:0}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--surface2)}
.dots i.d{background:var(--accent)}
.dots i.m{background:var(--danger);opacity:.6}
.taskstat summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:12px 0;font-weight:600}
.taskstat summary::-webkit-details-marker{display:none}
.taskstat{border-top:1px solid var(--line)}
.taskstat:first-child{border-top:0}
.taskstat .body{padding-bottom:12px}

/* Shop */
.balance{font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.balance small{font-size:1rem;color:var(--fg2);font-weight:600;letter-spacing:0;margin-left:6px}
.titlebar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.titlebar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .6s var(--ease)}
.reward{display:flex;flex-direction:column;gap:10px}
.reward .bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.reward .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.reward.locked .bar i{background:var(--fg3)}
.locker-item{opacity:1}
.locker-item.used{opacity:.5}

/* Settings */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc summary{padding:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:650}
.acc summary::-webkit-details-marker{display:none}
.acc summary .muted{font-weight:500;font-size:.85rem}
.acc .body{padding:0 16px 16px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.opt:first-child{border-top:0}
.opt label{font-weight:600}
.opt .hint{font-size:.8rem;color:var(--fg2);font-weight:400}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;transition:transform .12s}
.sw.on{border-color:var(--fg);transform:scale(1.1)}
.toggle{width:50px;height:30px;border-radius:30px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background var(--dur);flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg2);transition:all var(--dur) var(--ease)}
.toggle.on{background:var(--accent);border-color:transparent}
.toggle.on::after{left:25px;background:var(--accent-fg)}
input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden}
.editrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.editrow:first-child{border-top:0}
.editrow .name{flex:1;font-weight:600}
.editrow.archived .name{color:var(--fg2);text-decoration:line-through}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg2);background:var(--surface2)}
.iconbtn svg{width:18px;height:18px}

/* Tour */
.tour-spot{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);pointer-events:none;transition:all .3s var(--ease)}
.tour-card{position:fixed;z-index:71;left:50%;transform:translateX(-50%);width:min(90vw,380px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.tour-card p{margin-bottom:12px}
.tour-card .row{justify-content:space-between}

/* Progress */
.hero .heroval{font-size:3rem;font-weight:700;letter-spacing:-.04em;line-height:1;display:flex;align-items:baseline;gap:8px}
.hero .heroval small{font-size:1.2rem;color:var(--fg2);font-weight:600}
.ring.sm{width:76px;height:76px;flex:none}
.delta{font-size:.8rem;font-weight:700;letter-spacing:0;padding:2px 7px;border-radius:var(--r-pill);background:var(--surface2);color:var(--fg2)}
.delta.up{color:var(--accent);background:var(--accent-soft)}
.delta.down{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.stat b .delta{font-size:.7rem;vertical-align:middle}
.callout{border-left:3px solid var(--accent)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wdbar{height:84px;width:100%;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wdbar i{display:block;width:100%;background:var(--accent);border-radius:8px;transition:height .5s var(--ease)}
.wdbar i.low{background:var(--danger);opacity:.75}
.wdbar i.none{background:transparent}
.wd .n{font-size:.75rem;font-weight:700;color:var(--fg2)}
.tod{display:grid;grid-template-columns:88px 1fr 36px;align-items:center;gap:10px;padding:5px 0}
.todbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.todbar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .5s var(--ease)}
.todbar i.warn{background:var(--danger);opacity:.7}
.tod .tiny{text-align:right}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:10px}
.legend i{width:15px;height:15px;border-radius:5px;background:var(--surface2);display:block}
.legend i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface2))}
.legend i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface2))}
.legend i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface2))}
.legend i.l4{background:var(--accent)}
.taskcard{padding:14px}
.taskcard summary{list-style:none;cursor:pointer;display:flex}
.taskcard summary::-webkit-details-marker{display:none}
.taskcard .strbar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:8px}
.taskcard .strbar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s var(--ease)}
.taskcard .body{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:1.1rem;flex:none}
.pairstreak .heroval{font-size:2.4rem;font-weight:700;letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px}
.pairstreak .heroval small{font-size:.95rem;color:var(--fg2);font-weight:600}
.pairfire{width:54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--fg3)}
.pairfire.lit{background:var(--accent-soft);color:var(--accent)}
.pairfire svg{width:26px;height:26px}
.bar.quest{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden}
.bar.quest i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .6s var(--ease)}
.todo{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface2);transition:opacity var(--dur),transform var(--dur)}
.todo .name{flex:1;font-weight:500;min-width:0}
.todo .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--fg3);display:grid;place-items:center;flex:none;transition:all var(--dur)}
.todo .tick svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all var(--dur)}
.todo .tick.on,.todo.ticking .tick{border-color:var(--accent);background:var(--accent)}
.todo .tick.on svg,.todo.ticking .tick svg{opacity:1;transform:none;color:var(--accent-fg)}
.todo.ticking{opacity:0;transform:translateX(24px)}
.todo.done{opacity:.55}
.todo.done .name{text-decoration:line-through;text-decoration-color:var(--fg3)}
.iconbtn.ghosty{background:transparent;opacity:.5;width:30px;height:30px}
.iconbtn.ghosty svg{width:15px;height:15px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.sr{position:absolute;left:-9999px}
</style>

<canvas id="fx"></canvas>
<script>
/* ============ Steady — local-first consistency tracker ============ */
const KEY = 'steady.v2';
/* ---- Friends sync config ----
   Project URL (no /rest/v1 suffix) and publishable key. This key is meant to be
   public — row-level security in supabase.sql is what actually protects the data.
   Leave blank and the Friends tab runs in demo mode with a local fake friend.
   Only aggregates ever leave the device: cleared/done/expected counts, streak,
   consistency and level. Task names, notes, miss reasons and your "why" never sync. */
const SYNC = {
  url:    'https://rjytcvajeysfnfmtgakm.supabase.co',
  anonKey:'sb_publishable_YY7K6b6P_E1HoQxAu_PTsg_MYU0lTeA'
};
const MAX_REWARDS = 5, BUY_STRENGTH = 70, TASK_BASE = 10, CLEAR_PER_TASK = 5, CHEST_DAYS = 6;
/* Prices are denominated in days of work, not fixed coins, so task count changes what you do — never what you can afford. */
const OT_PER = 5, OT_TASK_CAP = 10, OT_DAY_CAP = 20; // 1 coin per 5 min over target, capped per task and per day
const TIER_DAYS = {week:7, fortnight:14};
const TIER_LABEL = {week:'Week', fortnight:'Fortnight'};
const round10 = n => Math.round(n/10)*10;
const anyTimed = () => activeTasks().some(t=>t.target);
const dayRate = () => Math.max(1, activeTasks().length) * (TASK_BASE*1.3 + CLEAR_PER_TASK) + (anyTimed()?OT_DAY_CAP/2:0); // a cleared day at healthy strength
const tierCost = t => round10(dayRate()*(TIER_DAYS[t]||TIER_DAYS.week));
const chestCoins = () => round10(dayRate());
const freezeCost = () => round10(dayRate()*1.5);
const TITLES = [['Drifter',1],['Steady',5],['Committed',12],['Relentless',20]]; // by level
const xpToNext = L => Math.round(60*Math.pow(L,1.2));
const loginBonus = s => s<2?0:s<7?5:s<30?10:15;
const DEFAULT_REASONS = ['Forgot','No time','Not feeling it','Something came up'];
const DEFAULT_QUOTES = [
  ['We are what we repeatedly do. Excellence, then, is not an act but a habit.','Will Durant'],
  ['Small things done consistently beat big things done occasionally.','—'],
  ['You do not rise to the level of your goals. You fall to the level of your systems.','James Clear'],
  ['Motivation gets you started. Habit keeps you going.','Jim Ryun'],
  ['It always seems impossible until it is done.','Nelson Mandela'],
  ['How you do anything is how you do everything.','—'],
  ['Discipline is choosing between what you want now and what you want most.','Abraham Lincoln (attrib.)'],
  ['A river cuts through rock not because of its power, but its persistence.','James N. Watkins'],
  ['Show up. Especially on the days you don’t want to.','—'],
  ['The secret of getting ahead is getting started.','Mark Twain'],
];
const THEMES = {
  teal:{h:175,s:22,accent:'#2dd4bf'}, pink:{h:340,s:22,accent:'#f472b6'},
  grey:{h:220,s:6,accent:'#a3a3a3'}, black:{h:0,s:0,accent:'#ffffff'},
  blue:{h:222,s:24,accent:'#60a5fa'}, green:{h:145,s:20,accent:'#4ade80'},
};
const ACCENTS = ['#2dd4bf','#60a5fa','#a78bfa','#f472b6','#fb923c','#facc15','#4ade80','#f87171'];

const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const parse = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parse(k); d.setDate(d.getDate()+n); return dkey(d); };
const fmt = (k,o={weekday:'short',day:'numeric',month:'short'}) => parse(k).toLocaleDateString(undefined,o);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function fresh(){
  return {
    tasks:[], rewards:[], locker:[], customReasons:[],
    quotes: DEFAULT_QUOTES.map(([text,author])=>({id:uid(),text,author,custom:false})),
    days:{}, streak:{login:0,best:0}, points:{coins:0,xp:0}, freezes:0, chests:{},
    me:null, friends:{}, pairs:{}, demo:false, outbox:[], cheersIn:[], todos:[],
    settings:{theme:'teal',mode:'dark',accent:null,density:'comfy',corners:'round',font:'system',textSize:100,motion:true,haptics:true,glow:true},
    flags:{onboarded:false,why:'',whys:[],lastOpen:null,quoteDate:null,tours:{}},
    pendingMisses:[], undo:null,
  };
}
let S = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(!raw) return fresh();
    const s=fresh(); const p=JSON.parse(raw);
    const m={...s,...p,settings:{...s.settings,...(p.settings||{})},flags:{...s.flags,...(p.flags||{})}};
    if(m.points.coins===undefined){ m.points={coins:m.points.balance||0,xp:m.points.lifetime||0}; } // migrate v2 pot → coins/xp
    if(!Array.isArray(m.flags.whys)) m.flags.whys=[];
    if(m.flags.why && !m.flags.whys.length) m.flags.whys=[m.flags.why];
    if(!m.flags.why && m.flags.whys.length) m.flags.why=m.flags.whys[0];
    m.rewards.forEach(r=>{ if(!TIER_DAYS[r.tier]) r.tier = r.tier==='big' ? 'fortnight' : 'week'; }); // small/medium/big → day-based tiers
    return m;
  }catch(e){ return fresh(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ---------- List ----------
   Deliberately outside the economy: no points, no strength, no miss gate.
   Its job is to give you something to reach for, not another thing to fail. */
function todosToday(){ return S.todos.filter(t=>!t.done && t.day && t.day<=today()).sort((a,b)=>a.createdAt-b.createdAt); }
function todosDone(){ return S.todos.filter(t=>t.done && t.doneDay===today()); }
function backlog(){ return S.todos.filter(t=>!t.done && !t.day).sort((a,b)=>b.createdAt-a.createdAt); }
function addTodo(text,toToday=true){ S.todos.push({id:uid(),text,day:toToday?today():null,done:false,createdAt:Date.now()}); save(); }
function toggleTodo(id){ const t=S.todos.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; t.doneDay=t.done?today():null; if(t.done&&!t.day) t.day=today(); save(); }
function pullTodo(id){ const t=S.todos.find(x=>x.id===id); if(t){ t.day=today(); save(); } }
function dropTodo(id){ S.todos=S.todos.filter(x=>x.id!==id); save(); }
function pushTodo(id){ const t=S.todos.find(x=>x.id===id); if(t){ t.day=null; save(); } } // back to the backlog

/* ---------- Friends ---------- */
const CHEER_COINS = 5, QUEST_GOAL_PER_PERSON = 5; // 5 cleared days each across the week
function me(){ if(!S.me){ S.me={id:uid()+uid(),name:'',code:('STDY'+Math.random().toString(36).slice(2,6)).toUpperCase()}; save(); } return S.me; }
function myDay(k=today()){ const s=dayStats(k); return {date:k,cleared:!!S.days[k]?.cleared,done:s.done,expected:s.expected,streak:S.streak.login,consistency:avgStrength(),level:level().L,title:title().name}; }
function friendList(){ return Object.values(S.friends); }
function clearedOn(f,k){ return !!f.days?.[k]?.cleared; }
/* Shared streak: a day counts only if you both cleared it. Today is optional so it doesn't read as broken before bedtime. */
function pairStreak(f){
  let n=0, k=(S.days[today()]?.cleared && clearedOn(f,today())) ? today() : addDays(today(),-1);
  while(S.days[k]?.cleared && clearedOn(f,k)){ n++; k=addDays(k,-1); }
  return n;
}
function questWeek(){ return weekOf(today()); }
function questProgress(f){
  const mon=questWeek(); let mine=0, theirs=0;
  for(let i=0;i<7;i++){ const k=addDays(mon,i); if(S.days[k]?.cleared) mine++; if(clearedOn(f,k)) theirs++; }
  return {mine,theirs,total:mine+theirs,goal:QUEST_GOAL_PER_PERSON*2};
}
function checkQuest(f){
  const p=S.pairs[f.id]||(S.pairs[f.id]={}); const wk=questWeek();
  const q=questProgress(f);
  if(q.total>=q.goal && p.questPaid!==wk){ p.questPaid=wk; const c=chestCoins(); S.points.coins+=c; S.points.xp+=c; save(); return c; }
  return 0;
}
function canCheer(f){ const p=S.pairs[f.id]||{}; return p.cheerDate!==today(); }

/* Sync adapter. Two implementations behind one interface so the UI never knows which is live. */
let _sb=null;
async function sb(){
  if(_sb) return _sb;
  const m=await import('https://esm.sh/@supabase/supabase-js@2');
  _sb=m.createClient(SYNC.url,SYNC.anonKey);
  const {data}=await _sb.auth.getSession();
  if(!data.session) await _sb.auth.signInAnonymously();
  return _sb;
}
const Sync = {
  configured(){ return !!(SYNC.url && SYNC.anonKey); },
  live(){ return this.configured() && !S.demo; },
  async register(name){
    me().name=name; save();
    if(!this.live()) return;
    const c=await sb(); const {data:{user}}=await c.auth.getUser();
    await c.from('profiles').upsert({id:user.id,code:me().code,display_name:name});
    S.me.id=user.id; save();
  },
  async addByCode(code){
    code=code.trim().toUpperCase();
    if(code===me().code) throw new Error('That is your own code.');
    if(!this.live()){ // demo: fabricate a friend with plausible history
      const f={id:'demo-'+code,name:'Sam',code,days:{},demo:true};
      for(let i=0;i<28;i++){ const k=addDays(today(),-i); f.days[k]={cleared:Math.random()<(i<7?0.75:0.6),consistency:71,streak:12,level:6,title:'Committed'}; }
      f.consistency=71; f.streak=12; f.level=6; f.title='Committed';
      S.friends[f.id]=f; save(); return f;
    }
    const c=await sb();
    const {data:p,error}=await c.from('profiles').select('id,display_name,code').eq('code',code).single();
    if(error||!p) throw new Error('No one with that code.');
    const {data:{user}}=await c.auth.getUser();
    await c.from('friendships').upsert({a_id:user.id,b_id:p.id});
    S.friends[p.id]={id:p.id,name:p.display_name,code:p.code,days:{}}; save();
    await this.pull(); return S.friends[p.id];
  },
  async push(){
    if(!this.live()) return;
    try{ const c=await sb(); const {data:{user}}=await c.auth.getUser();
      const rows=[myDay(),myDay(addDays(today(),-1))].map(d=>({...d,user_id:user.id}));
      await c.from('daily_stats').upsert(rows,{onConflict:'user_id,date'});
      S.outbox=[]; save();
    }catch(e){ S.outbox=[myDay()]; save(); } // retried on next open
  },
  async pull(){
    if(!this.live()) return this._demoDrift();
    const c=await sb(); const ids=Object.keys(S.friends); if(!ids.length) return;
    const since=addDays(today(),-30);
    const {data}=await c.from('daily_stats').select('*').in('user_id',ids).gte('date',since);
    (data||[]).forEach(r=>{ const f=S.friends[r.user_id]; if(!f) return;
      f.days[r.date]={cleared:r.cleared,done:r.done,expected:r.expected};
      if(r.date===today()||!f.consistency){ f.consistency=r.consistency; f.streak=r.streak; f.level=r.level; f.title=r.title; } });
    const {data:{user}}=await c.auth.getUser();
    const {data:ch}=await c.from('cheers').select('*').eq('to_id',user.id).eq('applied',false);
    let got=0; for(const x of (ch||[])){ if(x.kind==='cheer'){ S.points.coins+=CHEER_COINS; got+=CHEER_COINS; } }
    if(ch?.length) await c.from('cheers').update({applied:true}).in('id',ch.map(x=>x.id));
    if(got) S.flags.pendingToast=`A cheer landed · +${got} coins`;
    save();
  },
  _demoDrift(){ const f=friendList()[0]; if(f?.demo && !f.days[today()]) { f.days[today()]={cleared:Math.random()<0.7}; save(); } },
  async cheer(f,kind){
    const p=S.pairs[f.id]||(S.pairs[f.id]={}); p.cheerDate=today(); save();
    if(!this.live()) return;
    const c=await sb(); const {data:{user}}=await c.auth.getUser();
    await c.from('cheers').insert({from_id:user.id,to_id:f.id,kind,date:today(),applied:false});
  },
};

/* ---------- Theme ---------- */
function applyTheme(){
  const st=S.settings, t=THEMES[st.theme]||THEMES.teal;
  const dark = st.mode==='dark' || (st.mode==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const acc = st.accent || t.accent;
  const r=document.documentElement.style;
  const hs=(l)=>`hsl(${t.h} ${t.s}% ${l}%)`;
  if(dark){
    r.setProperty('--bg',hs(st.theme==='black'?0:7)); r.setProperty('--surface',hs(st.theme==='black'?6:11));
    r.setProperty('--surface2',hs(st.theme==='black'?11:16)); r.setProperty('--line',`hsl(${t.h} ${t.s}% ${st.theme==='black'?14:20}% / .8)`);
    r.setProperty('--fg',hs(96)); r.setProperty('--fg2',hs(62)); r.setProperty('--fg3',hs(32));
  } else {
    r.setProperty('--bg',hs(96)); r.setProperty('--surface',hs(100)); r.setProperty('--surface2',hs(93));
    r.setProperty('--line',`hsl(${t.h} ${t.s}% 84% / .9)`);
    r.setProperty('--fg',hs(10)); r.setProperty('--fg2',hs(42)); r.setProperty('--fg3',hs(72));
  }
  r.setProperty('--accent',acc);
  r.setProperty('--accent-fg', luminance(acc)>0.5?'#0b0f0e':'#ffffff');
  r.setProperty('--accent-on-dark', dark? acc : lighten(acc));
  r.setProperty('--accent-soft',`color-mix(in srgb, ${acc} ${dark?18:14}%, transparent)`);
  r.setProperty('--danger','#f87171');
  r.setProperty('--glow', st.glow?`0 6px 24px color-mix(in srgb, ${acc} 35%, transparent)`:'none');
  r.setProperty('--glow-f', st.glow?`drop-shadow(0 0 6px color-mix(in srgb, ${acc} 60%, transparent))`:'none');
  r.setProperty('--font',`var(--font-${st.font})`);
  r.setProperty('--fs',`${16*st.textSize/100}px`);
  const rad={sharp:[6,4],soft:[12,8],round:[18,12],pill:[26,16]}[st.corners]||[18,12];
  r.setProperty('--r',rad[0]+'px'); r.setProperty('--r-sm',rad[1]+'px');
  r.setProperty('--pad',st.density==='compact'?'12px':'16px'); r.setProperty('--gap',st.density==='compact'?'10px':'14px');
  document.body.classList.toggle('reduce',!st.motion);
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0f1a19';
}
function hexrgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function luminance(h){const [r,g,b]=hexrgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b;}
function lighten(h){const [r,g,b]=hexrgb(h);return `rgb(${[r,g,b].map(v=>Math.round(v+(255-v)*.5)).join(',')})`;}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();});

function haptic(kind='light'){ if(!S.settings.haptics||!navigator.vibrate) return; navigator.vibrate(kind==='heavy'?[18,40,18]:kind==='success'?[10,30,10,30,10]:8); }

/* ---------- Task helpers ---------- */
const activeOn = (t,k) => t.createdAt<=k && (!t.archived || (t.archivedAt && t.archivedAt>k));
const activeTasks = (k=today()) => S.tasks.filter(t=>activeOn(t,k)).sort((a,b)=>a.order-b.order);
function day(k){ return S.days[k] || (S.days[k]={tasks:{},points:0,bonus:0,note:'',perfect:false}); }
function statusOf(k,tid){ return S.days[k]?.tasks?.[tid]?.status || 'open'; }
function expectedOn(k){ // task ids expected that day
  const d=S.days[k]; if(d && d.finalized) return Object.keys(d.tasks);
  return activeTasks(k).map(t=>t.id);
}
function dayStats(k){
  const ids=expectedOn(k); const done=ids.filter(id=>statusOf(k,id)==='done').length;
  return {expected:ids.length,done,missed:ids.filter(id=>statusOf(k,id)==='missed').length,points:(S.days[k]?.points||0)+(S.days[k]?.bonus||0),perfect:ids.length>0&&done===ids.length};
}
/* Loop-style habit strength: 0–100, climbs ~5/day, decays 5%/day. Never resets to zero on a miss. */
function strengthOf(t,k=today()){ let s=0; for(let x=t.createdAt;x<=k;x=addDays(x,1)){ const st=statusOf(x,t.id); if(x===k&&st==='open') break; s=s*0.95+(st==='done'?5:0); } return clamp(Math.round(s),0,100); }
function avgStrength(k=today()){ const ts=activeTasks(k); if(!ts.length) return 0; return Math.round(ts.reduce((a,t)=>a+strengthOf(t,k),0)/ts.length); }
function taskValue(t){ return Math.round(TASK_BASE*(1+0.5*strengthOf(t,addDays(today(),-1))/100)); }
/* Overtime pays coins only — never XP — so long sessions can't buy levels or titles. Consistency does that. */
function overtimeFor(t,mins){ if(!t.target||!mins) return 0; return clamp(Math.floor((mins-t.target)/OT_PER),0,OT_TASK_CAP); }
function overtimeToday(k=today()){ return Object.values(S.days[k]?.tasks||{}).reduce((a,x)=>a+(x.bonus||0),0); }
function level(){ let L=1,xp=S.points.xp; while(xp>=xpToNext(L)){xp-=xpToNext(L);L++;} return {L,into:xp,need:xpToNext(L)}; }
function title(){ const L=level().L; let t=TITLES[0]; for(const x of TITLES) if(L>=x[1]) t=x; const next=TITLES[TITLES.indexOf(t)+1]; return {name:t[0],level:L,next:next?{name:next[0],at:next[1]}:null}; }
function weekOf(k){ return addDays(k,-((parse(k).getDay()+6)%7)); }
/* Rolling windows so any period can be compared with the one before it. */
const RANGE_DAYS={day:1,week:7,month:30,year:365};
function windowStats(r,back=0){
  const n=RANGE_DAYS[r]||7, end=addDays(today(),-n*back), start=addDays(end,-(n-1));
  let e=0,d=0,p=0,pf=0,m=0,mins=0;
  for(let x=start;x<=end;x=addDays(x,1)){ const s=dayStats(x); e+=s.expected;d+=s.done;p+=s.points;m+=s.missed; if(s.perfect)pf++;
    for(const t of Object.values(S.days[x]?.tasks||{})) if(t.minutes) mins+=t.minutes; }
  return {rate:e?Math.round(100*d/e):0,points:p,perfect:pf,missed:m,minutes:mins,days:n,expected:e};
}
function weekdayPattern(weeks=8){
  const out=Array.from({length:7},()=>({e:0,d:0}));
  for(let i=0;i<weeks*7;i++){ const k=addDays(today(),-i); const s=dayStats(k); if(!s.expected) continue;
    const w=(parse(k).getDay()+6)%7; out[w].e+=s.expected; out[w].d+=s.done; }
  return out.map(x=>x.e?Math.round(100*x.d/x.e):null);
}
function timeOfDay(){
  const b=[0,0,0]; for(const d of Object.values(S.days)) for(const t of Object.values(d.tasks||{}))
    if(t.doneAt){ const h=new Date(t.doneAt).getHours(); b[h<12?0:h<17?1:2]++; }
  return b;
}
function reasonBreakdown(days=90){
  const cut=addDays(today(),-days), c={}; let n=0;
  for(const m of allMisses()) if(m.date>=cut && m.reason){ c[m.reason]=(c[m.reason]||0)+1; n++; }
  return {total:n,items:Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([r,v])=>[r,Math.round(100*v/n)])};
}
const historyDays = () => Object.values(S.days).filter(d=>d.finalized).length;
function weakLink(){
  if(historyDays()<14) return null; // needs enough history to be a fair call
  const ts=activeTasks().map(t=>({t,s:strengthOf(t)})).sort((a,b)=>a.s-b.s);
  if(ts.length<2) return null; const {t,s}=ts[0]; if(s>=80 || ts[1].s-s<10) return null;
  const dows={}; for(const [k,d] of Object.entries(S.days)) if(d.tasks?.[t.id]?.status==='missed'){ const n=parse(k).toLocaleDateString(undefined,{weekday:'long'}); dows[n]=(dows[n]||0)+1; }
  const worst=Object.entries(dows).sort((a,b)=>b[1]-a[1])[0];
  return {name:t.name,strength:s,day:worst&&worst[1]>=2?worst[0]:null};
}
function weekCleared(mon){ let c=0,any=false; for(let i=0;i<7;i++){const s=dayStats(addDays(mon,i)); if(s.expected)any=true; if(s.perfect)c++;} return {cleared:c,any}; }
function quoteToday(){ const q=S.quotes; if(!q.length) return null; const n=parse(today()).getTime()/86400000|0; return q[n%q.length]; }

/* ---------- Day boundary / streak ---------- */
function rollover(){
  const t=today(); const last=S.flags.lastOpen;
  if(last===t) return;
  // finalize every day between last open and today
  if(last){ let k=last; while(k<t){ finalize(k); k=addDays(k,1);} }
  // login streak — a streak freeze covers exactly one skipped day
  const notes=[];
  if(last && addDays(last,1)===t) S.streak.login+=1;
  else if(last && addDays(last,2)===t && S.freezes>0){ S.freezes--; S.streak.login+=1; day(addDays(t,-1)).frozen=true; notes.push('Streak freeze used — streak kept'); }
  else S.streak.login=1;
  S.streak.best=Math.max(S.streak.best,S.streak.login);
  const d=day(t);
  const lb=loginBonus(S.streak.login);
  if(lb && !d.bonusGiven){ d.bonus=lb; d.bonusGiven=true; S.points.coins+=lb; S.points.xp+=lb; }
  // weekly chest for the week that just finished
  const lastMon=addDays(weekOf(t),-7);
  if(last && !S.chests[lastMon]){ const w=weekCleared(lastMon); if(w.any){ S.chests[lastMon]=w.cleared>=CHEST_DAYS?'won':'missed'; if(w.cleared>=CHEST_DAYS){ const cc=chestCoins(); S.points.coins+=cc; S.points.xp+=cc; notes.push(`Weekly chest: ${w.cleared} days cleared · +${cc}`); } } }
  if(notes.length) S.flags.pendingToast=notes.join(' · ');
  S.flags.lastOpen=t; S.undo=null; sel.clear(); save();
}
function finalize(k){
  const d=day(k); if(d.finalized) return;
  for(const t of activeTasks(k)){
    if(!d.tasks[t.id]) d.tasks[t.id]={status:'missed'};
    if(d.tasks[t.id].status==='missed' && !d.tasks[t.id].reason) S.pendingMisses.push({date:k,taskId:t.id});
  }
  d.finalized=true;
}

/* ---------- Completing ---------- */
const sel=new Set();
function completeSelected(mins){
  const k=today(), ids=[...sel]; if(!ids.length) return;
  const d=day(k), tasks=activeTasks(k), n=tasks.length;
  let coins=0, xp=0; const changed=[]; let otRoom=OT_DAY_CAP-overtimeToday(k);
  for(const id of ids){
    if(d.tasks[id]?.status==='done') continue;
    const t=tasks.find(x=>x.id===id); const v=taskValue(t);
    const m=mins?.[id]||null;
    const bonus=clamp(overtimeFor(t,m),0,Math.max(0,otRoom)); otRoom-=bonus;
    d.tasks[id]={status:'done',doneAt:Date.now(),value:v,bonus,minutes:m};
    coins+=v+bonus; xp+=v; changed.push(id);
  }
  const doneCount=Object.values(d.tasks).filter(x=>x.status==='done').length;
  let cleared=false;
  if(doneCount===n && !d.cleared){ d.cleared=true; d.clearBonus=CLEAR_PER_TASK*n; coins+=d.clearBonus; xp+=d.clearBonus; cleared=true; }
  d.points+=coins; S.points.coins+=coins; S.points.xp+=xp; d.perfect=doneCount===n;
  S.undo={date:k,ids:changed,coins,xp,cleared};
  sel.clear(); save();
  haptic(cleared?'success':'light');
  changed.forEach(id=>document.querySelector(`[data-task="${id}"]`)?.classList.add('leaving'));
  setTimeout(()=>{ render(); if(cleared&&typeof friendsTick==='function') friendsTick(); toast(cleared?`Day cleared · +${coins}`:`${changed.length===1?'Marked done':changed.length+' marked done'} · +${coins}`, 'Undo', undoLast); if(cleared) celebrate(); }, S.settings.motion?220:0);
}
function undoLast(){
  const u=S.undo; if(!u) return; const d=day(u.date);
  u.ids.forEach(id=>{ delete d.tasks[id]; });
  if(u.cleared){ d.cleared=false; d.clearBonus=0; }
  d.points-=u.coins; S.points.coins-=u.coins; S.points.xp-=u.xp; d.perfect=false;
  S.undo=null; save(); haptic(); render(); toast('Undone');
}

let toastT;
function toast(msg,action,fn){
  const el=document.getElementById('toast'); clearTimeout(toastT);
  el.innerHTML=`<span>${esc(msg)}</span>${action?`<button id="toastact">${esc(action)}</button>`:''}`;
  if(action) el.querySelector('#toastact').onclick=()=>{ el.classList.remove('show'); fn&&fn(); };
  el.classList.add('show'); toastT=setTimeout(()=>el.classList.remove('show'),action?6000:2200);
}

function celebrate(){
  if(!S.settings.motion) return;
  const c=document.getElementById('fx'),x=c.getContext('2d'); c.width=innerWidth;c.height=innerHeight;
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*5+3,c:Math.random()<.6?acc:'#fff',a:Math.random()*6,s:Math.random()*.2-.1}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-f/70);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();}); if(++f<80) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

function pCalendar(){
  const k=today(); const [y,m]=progState.month.split('-').map(Number);
  const first=new Date(y,m-1,1), off=(first.getDay()+6)%7, days=new Date(y,m,0).getDate();
  let cells=''; for(let i=0;i<off;i++) cells+='<div></div>';
  for(let i=1;i<=days;i++){ const dk=`${y}-${pad(m)}-${pad(i)}`; const s=dayStats(dk); const p=s.expected?s.done/s.expected:0;
    const lvl=s.expected===0||dk>k?'':p>=1?'l4':p>=.66?'l3':p>=.33?'l2':p>0?'l1':'';
    cells+=`<button class="cell ${lvl} ${dk===k?'today':''} ${dk===progState.sel?'sel':''} ${dk>k?'future':''} ${S.days[dk]?.note?'hasnote':''}" data-day="${dk}">${i}</button>`; }
  const selS=dayStats(progState.sel);
  const selTasks=expectedOn(progState.sel).map(id=>({t:S.tasks.find(x=>x.id===id),st:S.days[progState.sel]?.tasks?.[id]})).filter(x=>x.t);
  const mstat=(()=>{ let e=0,d=0,c=0; for(let i=1;i<=days;i++){const dk=`${y}-${pad(m)}-${pad(i)}`; if(dk>=k) continue; const s=dayStats(dk); e+=s.expected;d+=s.done; if(s.perfect)c++;} return {rate:e?Math.round(100*d/e):0,cleared:c,any:e>0}; })();
  return `
  <div class="card" data-tour="heat">
    <div class="row between" style="margin-bottom:4px"><button class="iconbtn" data-month="-1">‹</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="iconbtn" data-month="1" ${progState.month>=k.slice(0,7)?'disabled style="opacity:.3"':''}>›</button></div>
    <p class="tiny muted" style="text-align:center;margin-bottom:12px">${mstat.any?`${mstat.rate}% completed · ${mstat.cleared} day${mstat.cleared===1?'':'s'} cleared`:'No history this month'}</p>
    <div class="heat">${['M','T','W','T','F','S','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
    <div class="legend"><span class="tiny muted">Less</span>${['','l1','l2','l3','l4'].map(c=>`<i class="${c}"></i>`).join('')}<span class="tiny muted">More</span></div>
  </div>
  <div class="card"><div class="row between" style="margin-bottom:10px"><b>${fmt(progState.sel,{weekday:'long',day:'numeric',month:'long'})}</b><span class="small muted">${selS.expected?`${selS.done}/${selS.expected} · ${selS.points} coins`:'no tasks'}</span></div>
    ${progState.sel>today()?'<p class="muted small">Not here yet.</p>':selTasks.length?`<ul class="list">${selTasks.map(x=>`<li><span>${esc(x.t.name)}</span><span class="small ${x.st?.status==='done'?'':'muted'}" style="${x.st?.status==='done'?'color:var(--accent)':''}">${x.st?.status==='done'?`done${x.st.minutes?' · '+x.st.minutes+'m':''}`:x.st?.status==='missed'?`missed${x.st.reason?' · '+esc(x.st.reason):''}`:'open'}</span></li>`).join('')}</ul>`:'<p class="muted small">Nothing scheduled.</p>'}
    ${progState.sel>today()?'':`<textarea id="daynote" placeholder="Note for this day…" rows="2" style="margin-top:12px">${esc(S.days[progState.sel]?.note||'')}</textarea>`}</div>`;
}

function pTasks(){

        ${ts.comments.length?`<ul class="list small" style="margin-top:10px">${ts.comments.map(c=>`<li><span class="muted">${fmt(c.date)}</span><span style="text-align:right">${esc(c.comment)}</span></li>`).join('')}</ul>`:''}

function allMisses(){ const out=[]; for(const [k,d] of Object.entries(S.days)) for(const [id,x] of Object.entries(d.tasks||{})) if(x.status==='missed'){const t=S.tasks.find(t=>t.id===id); out.push({date:k,name:t?.name||'(deleted)',reason:x.reason,comment:x.comment});} return out.sort((a,b)=>a.date<b.date?-1:1); }
function records(){
  const k=today(); const keys=Object.keys(S.days).sort(); let run=0,best=0; 
  if(keys.length){ for(let x=keys[0];x<=k;x=addDays(x,1)){ if(dayStats(x).perfect){run++;best=Math.max(best,run);} else run=0; } }
  const weeks={}; for(const x of keys){const d=parse(x);const w=addDays(x,-((d.getDay()+6)%7)); weeks[w]=(weeks[w]||0)+dayStats(x).points;}
  const reasons={},dows={}; for(const m of allMisses()){ if(m.reason) reasons[m.reason]=(reasons[m.reason]||0)+1; const dn=parse(m.date).toLocaleDateString(undefined,{weekday:'long'}); dows[dn]=(dows[dn]||0)+1; }
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return {bestLogin:S.streak.best,perfectRun:best,bestWeek:Math.max(0,...Object.values(weeks)),topReason:top(reasons),worstDay:top(dows)};
}
function taskStats(t){
  const k=today(); let streak=0,best=0,run=0,done=0,misses=0; const reasons={},comments=[];
  for(let x=t.createdAt;x<=k;x=addDays(x,1)){ const s=statusOf(x,t.id); if(s==='done'){run++;best=Math.max(best,run);done++;} else if(s==='missed'){run=0;misses++;const r=S.days[x].tasks[t.id];if(r.reason)reasons[r.reason]=(reasons[r.reason]||0)+1;if(r.comment)comments.push({date:x,comment:r.comment});} }
  // current streak: consecutive done ending today or yesterday
  let x=statusOf(k,t.id)==='done'?k:addDays(k,-1); while(x>=t.createdAt&&statusOf(x,t.id)==='done'){streak++;x=addDays(x,-1);}
  const recent=Array.from({length:14},(_,i)=>statusOf(addDays(k,i-13),t.id));
  const mins=[]; for(const d of Object.values(S.days)){ const e=d.tasks?.[t.id]; if(e?.minutes) mins.push(e.minutes); }
  const total=mins.reduce((a,b)=>a+b,0);
  return {streak,best,done,misses,reasons:Object.entries(reasons).sort((a,b)=>b[1]-a[1]),comments:comments.slice(-5).reverse(),recent,
    hours:total>=60?`${(total/60).toFixed(1)}h`:`${total}m`, avgMin:mins.length?Math.round(total/mins.length):0};
}

function buy(id){
  const r=S.rewards.find(x=>x.id===id); if(!r) return; const cost=tierCost(r.tier); if(S.points.coins<cost||avgStrength()<BUY_STRENGTH) return;

    S.points.coins-=cost; S.locker.push({id:uid(),rewardId:id,name:r.name,boughtAt:today()}); save(); haptic('success'); render(); toast('Bought · in your locker'); });
}
function buyFreeze(){ const fc=freezeCost(); if(S.freezes||S.points.coins<fc) return; S.points.coins-=fc; S.freezes=1; save(); haptic('success'); render(); toast('Streak freeze ready'); }

  // Settings — tasks

  const ex=q('#export'); if(ex) ex.onclick=()=>{const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S,null,2));a.download=`steady-${today()}.json`;a.click();};
  const wp=q('#wipe'); if(wp) wp.onclick=()=>modal('<h2>Erase everything?</h2><p class="muted">Tasks, history, points and rewards. This cannot be undone.</p>','Erase',()=>{localStorage.removeItem(KEY);location.reload();},true);

function updateConfirm(){
  const bar=document.getElementById('confirmbar'), btn=document.getElementById('confirmbtn');

  btn.textContent=n>1?`Mark ${n} done`:'Mark done'; btn.onclick=()=>{ haptic('heavy'); const timed=[...sel].map(id=>S.tasks.find(t=>t.id===id)).filter(t=>t?.target); timed.length?timeSheet(timed):completeSelected(); };

/* ---------- Modal & sheet ---------- */
function overlay(html,cls=''){ const o=document.createElement('div'); o.className='overlay '+cls; o.innerHTML=html; document.body.appendChild(o); requestAnimationFrame(()=>o.classList.add('show')); return o; }
function close(o){ o.classList.remove('show'); setTimeout(()=>o.remove(),250); }
function modal(html,ok,fn,danger){
  const o=overlay(`<div class="modal">${html}<div class="foot" style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1" data-x>Cancel</button><button class="btn ${danger?'danger':'primary'}" style="flex:1" data-ok>${esc(ok)}</button></div></div>`,'center');
  o.querySelector('[data-x]').onclick=()=>close(o); o.onclick=e=>{if(e.target===o)close(o)}; o.querySelector('[data-ok]').onclick=()=>{close(o);fn();};
}
function prompt$(titleTxt,val,fn){
  const o=overlay(`<div class="modal"><h2>${esc(titleTxt)}</h2><input type="text" id="pv" value="${esc(val)}" style="margin-top:12px" maxlength="60"><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1" data-x>Cancel</button><button class="btn primary" style="flex:1" data-ok>Save</button></div></div>`,'center');
  const i=o.querySelector('#pv'); setTimeout(()=>{i.focus();i.select();},100);
  o.querySelector('[data-x]').onclick=()=>close(o); const ok=()=>{const v=i.value.trim();if(v){close(o);fn(v);}}; o.querySelector('[data-ok]').onclick=ok; i.onkeydown=e=>{if(e.key==='Enter')ok();};
}

function editTask(t){
  const o=overlay(`<div class="modal"><h2>Edit task</h2><div class="stack" style="margin-top:12px"><input type="text" id="en" value="${esc(t.name)}" maxlength="60">
    <div class="row"><input type="number" id="et" value="${t.target||''}" placeholder="Target minutes (optional)" min="1" max="600" style="flex:1;padding:12px 14px"><button class="btn sm" id="eclear">Clear</button></div>
    <p class="tiny muted">With a target set, you'll be asked how long it took each time you tick it off.</p></div>
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1" data-x>Cancel</button><button class="btn primary" style="flex:1" data-ok>Save</button></div></div>`,'center');
  o.querySelector('#eclear').onclick=()=>{o.querySelector('#et').value='';};
  o.querySelector('[data-x]').onclick=()=>close(o);
  o.querySelector('[data-ok]').onclick=()=>{ const n=o.querySelector('#en').value.trim(); if(!n) return; t.name=n; const tg=clamp(Math.round(Number(o.querySelector('#et').value)||0),0,600); t.target=tg||null; save(); close(o); render(); document.getElementById('acc-tasks').open=true; };
}

/* ---------- Time sheet (timed tasks) ---------- */
function timeSheet(timed){
  const mins={}; timed.forEach(t=>mins[t.id]=t.target);
  const room=()=>OT_DAY_CAP-overtimeToday();
  const opts=t=>[t.target,t.target+5,t.target+10,t.target+15,t.target+30];
  const card=t=>`<div class="card" style="padding:14px" data-time="${t.id}"><div class="row between"><b>${esc(t.name)}</b><span class="small muted" data-out>target ${t.target}m</span></div>
    <div class="timerow">${opts(t).map((m,i)=>`<button class="chip ${i===0?'on':''}" data-m="${m}">${m}m${i===0?'':''}</button>`).join('')}<button class="chip add" data-other>Other</button></div></div>`;
  const o=overlay(`<div class="sheet"><div class="grab"></div><h2>How long did ${timed.length===1?'it':'each'} take?</h2><p class="muted small" style="margin-bottom:14px">Under the target still counts as done. Over pays +1 coin per ${OT_PER} minutes.</p><p class="small" style="color:var(--accent);margin-bottom:12px" data-cap hidden>Daily time bonus capped at +${OT_DAY_CAP} — extra minutes past this won't add more.</p><div class="stack">${timed.map(card).join('')}</div><div class="foot"><button class="btn" data-skip>Skip</button><button class="btn primary" data-ok>Mark done</button></div></div>`);
  const refresh=()=>{ let left=room();
    timed.forEach(t=>{ const c=o.querySelector(`[data-time="${t.id}"] [data-out]`); const raw=overtimeFor(t,mins[t.id]); const b=clamp(raw,0,Math.max(0,left)); left-=b;
      c.innerHTML=b?`<span class="otval">+${b}</span> coins`:mins[t.id]<t.target?`under target`:`target ${t.target}m`; });
    o.querySelector('[data-ok]').textContent=sel.size>1?`Mark ${sel.size} done`:'Mark done';
    const cap=o.querySelector('[data-cap]'); if(cap) cap.hidden=left>0; };
  timed.forEach(t=>{ const el=o.querySelector(`[data-time="${t.id}"]`);
    const pick=(m,btn)=>{ el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); btn?.classList.add('on'); mins[t.id]=m; haptic(); refresh(); };
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.m),b));
    el.querySelector('[data-other]').onclick=()=>promptNum('Minutes on “'+t.name+'”',mins[t.id],v=>{ const b=document.createElement('button'); b.className='chip on'; b.textContent=v+'m'; b.dataset.m=v; b.onclick=()=>pick(v,b); el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); el.querySelector('[data-other]').before(b); mins[t.id]=v; refresh(); });
  });
  o.querySelector('[data-skip]').onclick=()=>{ close(o); completeSelected(); };
  o.querySelector('[data-ok]').onclick=()=>{ close(o); completeSelected(mins); };
  refresh();
}
function promptNum(titleTxt,val,fn){
  const o=overlay(`<div class="modal"><h2>${esc(titleTxt)}</h2><input type="number" id="pv" value="${val}" min="1" max="600" style="margin-top:12px;width:100%;padding:12px 14px"><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1" data-x>Cancel</button><button class="btn primary" style="flex:1" data-ok>Save</button></div></div>`,'center');
  const i=o.querySelector('#pv'); setTimeout(()=>{i.focus();i.select();},100);
  o.querySelector('[data-x]').onclick=()=>close(o);
  const ok=()=>{ const v=clamp(Math.round(Number(i.value)||0),1,600); close(o); fn(v); };
  o.querySelector('[data-ok]').onclick=ok; i.onkeydown=e=>{if(e.key==='Enter')ok();};
}

/* ---------- Miss-why gate ---------- */
function missGate(){
  const pend=S.pendingMisses; if(!pend.length) return false;
  const reasons=[...DEFAULT_REASONS,...S.customReasons]; const picked={};
  const item=(p,i)=>{const t=S.tasks.find(x=>x.id===p.taskId); return `<div class="card" style="padding:12px" data-miss="${i}"><div class="row between"><b>${esc(t?.name||'Task')}</b><span class="tiny muted">${fmt(p.date)}</span></div><div class="chips" style="margin-top:10px">${reasons.map(r=>`<button class="chip" data-r="${esc(r)}">${esc(r)}</button>`).join('')}<button class="chip add" data-custom>+ Other</button></div><input type="text" placeholder="Anything to add? (optional)" style="margin-top:10px;padding:9px 12px" data-c maxlength="120"></div>`;};
  const o=overlay(`<div class="sheet"><div class="grab"></div><h2>${pend.length===1?'One thing slipped':pend.length+' things slipped'}</h2><p class="muted small" style="margin-bottom:14px">No points lost. Just say why — patterns show up in Progress.</p>${pend.length>1?`<div class="chips" style="margin-bottom:12px"><span class="tiny muted" style="align-self:center">Same for all:</span>${reasons.map(r=>`<button class="chip" data-all="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}<div class="stack">${pend.map(item).join('')}</div><div class="foot"><button class="btn primary" data-ok disabled>Save</button></div></div>`);
  const okb=o.querySelector('[data-ok]');
  const check=()=>{okb.disabled=Object.keys(picked).length<pend.length;};
  o.querySelectorAll('[data-miss]').forEach(card=>{ const i=card.dataset.miss;
    card.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{card.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');picked[i]=c.dataset.r;haptic();check();});
    card.querySelector('[data-custom]').onclick=()=>prompt$('What got in the way?','',v=>{ if(!S.customReasons.includes(v)){S.customReasons.push(v);save();} const b=document.createElement('button');b.className='chip on';b.textContent=v;b.dataset.r=v;b.onclick=()=>{card.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');picked[i]=v;check();}; card.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); card.querySelector('[data-custom]').before(b); picked[i]=v; check(); });
  });
  o.querySelectorAll('[data-all]').forEach(a=>a.onclick=()=>{ o.querySelectorAll('[data-all]').forEach(x=>x.classList.remove('on')); a.classList.add('on'); o.querySelectorAll('[data-miss]').forEach(card=>{ card.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.r===a.dataset.all)); picked[card.dataset.miss]=a.dataset.all; }); haptic(); check(); });
  okb.onclick=()=>{ o.querySelectorAll('[data-miss]').forEach(card=>{const i=card.dataset.miss;const p=pend[i];const e=day(p.date).tasks[p.taskId]; if(e){e.reason=picked[i];const c=card.querySelector('[data-c]').value.trim();if(c)e.comment=c;}}); S.pendingMisses=[]; save(); close(o); haptic(); render(); toast('Noted. Fresh day.'); };
  return true;
}

/* ---------- Quote gate ---------- */
function quoteGate(next){
  const q=quoteToday(); if(!q||S.flags.quoteDate===today()){ next(); return; }
  const g=document.createElement('div'); g.className='gate';
  const aff=pickAffirmation();
  g.innerHTML=`<p class="q">${esc(q.text)}</p><p class="by">${q.author&&q.author!=='—'?esc(q.author):''}</p><div class="actions"><button class="btn primary block" id="startday">Start the day</button>${aff?`<p class="affline" style="margin-top:18px">${esc(aff)}</p>`:''}</div>`;
  document.body.appendChild(g);
  g.querySelector('#startday').onclick=()=>{ S.flags.quoteDate=today(); save(); haptic(); g.style.transition='opacity .3s'; g.style.opacity=0; setTimeout(()=>{g.remove();next();},300); };
}

/* ---------- Onboarding ---------- */
function onboarding(next){
  if(S.flags.onboarded){ next(); return; }
  let step=0; const picks=new Set(); const targets={}; const whys=[]; let whyIdx=0; let draft='';
  const g=document.createElement('div'); g.className='gate onb'; document.body.appendChild(g);
  const SUG=[['Walk',20],['Read',15],['No phone in bed',0],['Drink 2L water',0],['Tidy up',10],['Stretch',10],['Journal',0],['Study',30]];
  const commitDraft=()=>{ const v=(g.querySelector('#onbwhy')?.value||draft).trim(); if(v){ if(whyIdx<whys.length) whys[whyIdx]=v; else whys.push(v); draft=v; } };
  const draw=()=>{
    const steps=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
    if(step===0) g.innerHTML=`${steps}<h1>Consistency isn’t a mood.</h1><p>Big goals fail because they depend on how you feel that day. Small promises kept daily don’t.</p><p style="margin-top:14px">Steady gives every day a 100-point pot, splits it across your tasks, and pays out for showing up. Miss one and nothing is taken away — you just say why, so you can see your patterns.</p><p style="margin-top:14px">No account. Nothing leaves your phone.</p><div class="actions"><button class="btn primary block" data-n>Fair enough</button></div>`;
    if(step===1){
      const n=Math.max(whys.length, whyIdx+1);
      const show=whys[whyIdx]??draft;
      const pills=whys.length?`<div class="chips" style="margin-top:12px">${whys.map((w,i)=>`<button type="button" class="chip ${i===whyIdx?'on':''}" data-why="${i}">${esc(w.length>28?w.slice(0,28)+'…':w)}</button>`).join('')}</div>`:'';
      g.innerHTML=`${steps}<div class="row between" style="margin-bottom:8px"><button type="button" class="iconbtn" data-wb aria-label="Previous why" ${whyIdx<=0&&!whys.length?'disabled style="opacity:.3"':''}>‹</button><span class="tiny muted">Why ${whyIdx+1}${whys.length?` of ${Math.max(whys.length, whyIdx+1)}`:''}</span><button type="button" class="iconbtn" data-wa aria-label="Add another why">+</button></div><h1>Why does this matter to you?</h1><p>One line each. These become your affirmations — Steady picks one at random when you need it.</p>${pills}<textarea id="onbwhy" style="margin-top:18px" placeholder="e.g. I want to trust myself again." maxlength="200">${esc(show)}</textarea><div class="actions row"><button class="btn ghost" data-b>‹ Back</button><button class="btn ghost" data-n>Skip</button><button class="btn primary grow" data-n>Next</button></div>`;
    }
    if(step===2) g.innerHTML=`${steps}<h1>Pick two or three to start.</h1><p>You can change these any time in Settings. Fewer is better.</p><div class="chips" style="margin-top:18px">${SUG.map(([s,m])=>`<button class="chip ${picks.has(s)?'on':''}" data-p="${esc(s)}" data-mt="${m}">${esc(s)}${m?` <span class="tiny muted">${m}m</span>`:''}</button>`).join('')}</div><div class="row" style="margin-top:14px"><input type="text" id="onbtask" placeholder="Or write your own" maxlength="60"><button class="btn" id="onbadd">Add</button></div><div class="actions row"><button class="btn ghost" data-b>‹ Back</button><button class="btn primary grow" data-n>${picks.size?`Start with ${picks.size}`:'Start with none for now'}</button></div>`;
    g.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ if(step===1) commitDraft(); haptic(); if(step>0){step--;draw();} });
    g.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ if(step===1) commitDraft(); haptic(); if(step<2){step++;draw();} else finish(); });
    const wb=g.querySelector('[data-wb]'); if(wb) wb.onclick=()=>{ commitDraft(); haptic(); if(whyIdx>0){ whyIdx--; draft=whys[whyIdx]||''; draw(); } else if(step===1){ /* stay */ } };
    const wa=g.querySelector('[data-wa]'); if(wa) wa.onclick=()=>{ commitDraft(); const cur=(whys[whyIdx]||'').trim(); if(!cur && !(g.querySelector('#onbwhy')?.value||'').trim()){ toast('Write this one first'); return; } haptic(); whyIdx=whys.length; draft=''; draw(); setTimeout(()=>g.querySelector('#onbwhy')?.focus(),50); };
    g.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>{ commitDraft(); whyIdx=Number(b.dataset.why); draft=whys[whyIdx]||''; haptic(); draw(); });
    const ta=g.querySelector('#onbwhy'); if(ta) ta.oninput=()=>{ draft=ta.value; };
    g.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const v=b.dataset.p;if(picks.has(v))picks.delete(v);else{picks.add(v);targets[v]=Number(b.dataset.mt)||null;}draw();});
    const oa=g.querySelector('#onbadd'); if(oa){ const add=()=>{const v=g.querySelector('#onbtask').value.trim();if(v){picks.add(v);targets[v]=null;draw();}}; oa.onclick=add; g.querySelector('#onbtask').onkeydown=e=>{if(e.key==='Enter')add();}; }
  };
  const finish=()=>{ commitDraft(); const cleaned=whys.map(w=>w.trim()).filter(Boolean); S.flags.whys=cleaned; S.flags.why=cleaned[0]||''; [...picks].forEach((n,i)=>S.tasks.push({id:uid(),name:n,createdAt:today(),order:i,archived:false,target:targets[n]||null})); S.flags.onboarded=true; save(); g.remove(); next(); };
  draw();
}

/* ---------- Spotlight tour ---------- */
const TOURS={
  today:[['ring','Coins earned today. Each task pays 10, boosted by its habit strength.'],['tasks','Tap to pick, confirm at the bottom. The thin bar is strength — it grows when you show up and only dents when you don’t.'],['week','Clear 6 of 7 days and a chest lands Monday.'],['coins','Your coin balance. Tap it to jump to the shop.'],['list','Anything else you want done today. No points, no penalty — it is here so you always have something to reach for.']],
  progress:[['hero','One number: how consistent you have been lately, and which way it is moving.'],['stats','Every figure is compared with the period before it.'],['pattern','Where you actually fall over. Thursdays are rarely a coincidence.']],
  shop:[['balance','Coins to spend. XP fills the level bar and is never spent.'],['gate','Spending unlocks when average habit strength is 70%+.'],['freeze','Cheap insurance: one missed day, streak intact.'],['locker','What you buy lands here. Mark it used when you’ve enjoyed it.']],
  settings:[['tasks','Add, rename or archive tasks. Points re-split automatically.'],['look','Make it yours — theme, accent, corners, font, motion.']],
  friends:[['code','Swap codes to pair up. Only totals sync — never task names or notes.'],['friend','A shared streak and a weekly quest you clear together. No ranking.']],
};
function tour(page){
  if(S.flags.tours[page]||!TOURS[page]||document.querySelector('.gate,.overlay')) return;
  const steps=TOURS[page].filter(([id])=>$app.querySelector(`[data-tour="${id}"]`)); if(!steps.length) return;
  let i=0; const spot=document.createElement('div'); spot.className='tour-spot'; const card=document.createElement('div'); card.className='tour-card';
  document.body.append(spot,card);
  const draw=()=>{ const [id,txt]=steps[i]; const el=$app.querySelector(`[data-tour="${id}"]`); el.scrollIntoView({block:'center',behavior:'smooth'});
    setTimeout(()=>{ const r=el.getBoundingClientRect(); Object.assign(spot.style,{top:r.top-6+'px',left:r.left-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
      card.innerHTML=`<p>${txt}</p><div class="row"><span class="tiny muted">${i+1} of ${steps.length}</span><span class="row">${i?`<button class="btn sm ghost" data-back>Back</button>`:''}<button class="btn sm ghost" data-skip>Skip</button><button class="btn sm primary" data-next>${i<steps.length-1?'Next':'Got it'}</button></span></div>`;
      const below=r.bottom+180<innerHeight; card.style.top=below?r.bottom+16+'px':''; card.style.bottom=below?'':innerHeight-r.top+16+'px';
      card.querySelector('[data-next]').onclick=()=>{haptic(); if(++i<steps.length) draw(); else end();};
      card.querySelector('[data-back]')?.addEventListener('click',()=>{haptic(); if(i>0){i--;draw();}});
      card.querySelector('[data-skip]').onclick=end; },260); };
  const end=()=>{ spot.remove(); card.remove(); S.flags.tours[page]=true; save(); };
  draw();
}

/* ---------- Boot ---------- */
function friendsTick(){
  if(!friendList().length) return;
  Sync.pull().then(()=>{ let paid=0; friendList().forEach(f=>{ paid+=checkQuest(f); });
    if(paid) toast(`Quest complete · +${paid} coins`);
    if(tab==='friends') render(); }).catch(()=>{});
  Sync.push().catch(()=>{});
}
function maybeGates(){ if(S.flags.pendingToast){ toast(S.flags.pendingToast); S.flags.pendingToast=null; save(); } if(!missGate()) tour(tab); }
function boot(){
  applyTheme();
  onboarding(()=>{ rollover(); quoteGate(()=>{ document.getElementById('tabbar').hidden=false; render(); setTimeout(maybeGates,300); friendsTick(); }); });
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
