<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<title>Steady</title>
<meta name="description" content="A quiet, local-first habit tracker. Keep your word to yourself."/>
<meta name="theme-color" content="#0f1a19"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Steady"/>
<link rel="icon" type="image/svg+xml" href="./icon.svg"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<base href="/steady-live/">
<link rel="manifest" href="./manifest.json"/>

<!-- Critical styles inline: the splash must paint before app.css or app.js arrive. -->
<style>
:root{--bg:#0a1614;--fg:#e7faf4;--fg2:#8fb3ab;--accent:#2dd4bf}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#boot{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:var(--bg);transition:opacity .3s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .ring{width:64px;height:64px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 22%,transparent);
  border-top-color:var(--accent);animation:bootspin 1s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
#boot .word{font-size:1.35rem;font-weight:650;letter-spacing:-.01em}
#boot .sub{font-size:.85rem;color:var(--fg2)}
@media (prefers-reduced-motion:reduce){#boot .ring{animation:none}}
</style>
<!-- Match the saved theme before first paint, so there's no flash of the wrong colours. -->
<script>
(function(){try{
  /* Same colours as THEMES in app.v3.js ([bg, fg, fg2, accent], dark then light). Light/dark follows the
     phone, like the app does — this used to know only old theme names and always painted dark teal. */
  var s=JSON.parse(localStorage.getItem('steady.v2')||'{}').settings||{};
  var A={pink:'rose',grey:'ink',black:'ink',blue:'ocean',green:'moss'};
  var T={
    teal: [['#061411','#e7faf4','#7dcebf','#2ee6c8'],['#e6f4ef','#0c2924','#2f6b60','#0f766e']],
    dusk: [['#120c1c','#f5eeff','#c6b0e4','#c4a6ff'],['#f3eef9','#2a1640','#5c3d78','#7c3aed']],
    rose: [['#1a0810','#ffeff4','#f0a8bc','#ff6b8a'],['#fceef2','#3c101c','#8c3850','#e11d48']],
    ocean:[['#061018','#e8f4fc','#80c0e0','#3ec8f0'],['#e8f2fa','#0c2038','#2c5880','#0284c7']],
    moss: [['#0a140c','#eaf6e8','#9cd49a','#5ee89a'],['#eef6ea','#142414','#3c6438','#15803d']],
    sand: [['#14100a','#faf4e6','#e0c078','#f5c542'],['#faf4e8','#2c2414','#6c5830','#b45309']],
    ink:  [['#0c0c0e','#f4f4f5','#b0b0b8','#e8e8ec'],['#f2f2f4','#141418','#4a4a52','#18181b']]
  };
  var t=T[A[s.theme]||s.theme]||T.teal;
  var c=t[matchMedia('(prefers-color-scheme: light)').matches?1:0];
  var r=document.documentElement.style;
  r.setProperty('--bg',c[0]); r.setProperty('--fg',c[1]); r.setProperty('--fg2',c[2]); r.setProperty('--accent',c[3]);
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.content=c[0];
}catch(e){}})();
</script>

<link rel="modulepreload" href="./app.v3.js?b=80"/>
<link rel="modulepreload" href="./vendor/open-peeps-avatar.js"/>
<link rel="preload" href="./app.v3.css?b=80" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="./app.v3.css?b=80"/></noscript>
</head>
<body>
<div id="boot"><div class="ring"></div><div><div class="word">Steady</div><div class="sub" id="bootsub">one day at a time</div></div>
  <div id="bootfail" hidden><p style="max-width:26ch;text-align:center;font-size:.9rem;color:var(--fg2);line-height:1.5">
    Couldn't load the app files. If you opened <b>index.html</b> on its own, it won't run — it needs app.v3.js and app.v3.css beside it.
    Open the app from its web address instead.</p>
    <button id="bootretry" type="button" style="margin-top:14px;padding:11px 20px;border:0;border-radius:12px;background:var(--accent);color:#0b0f0e;font:inherit;font-weight:650">Try again</button></div></div>
<div id="motif" aria-hidden="true"></div>
<div id="app"></div>
<div class="tabbar" id="tabbar" hidden>
  <nav>
    <div class="ind" id="tabind"></div>
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Today<i class="tab-dot" hidden aria-hidden="true"></i></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v6h6"/><path d="M8 13h6M8 17h4"/></svg>Plan<i class="tab-dot" hidden aria-hidden="true"></i></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>Progress<i class="tab-dot" hidden aria-hidden="true"></i></button>
    <button data-tab="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Friends<i class="tab-dot" hidden aria-hidden="true"></i></button>
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Shop<i class="tab-dot" hidden aria-hidden="true"></i></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>Settings<i class="tab-dot" hidden aria-hidden="true"></i></button>
  </nav>
</div>
<div class="confirm-bar" id="confirmbar"><button class="btn primary" id="confirmbtn">Mark done</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
function steadyHardReload(){
  var go=function(){ location.replace('/steady-live/?t='+Date.now()); };
  var tasks=[];
  try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
  try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
  Promise.all(tasks).then(go, go);
}
window.steadyHardReload=steadyHardReload;
document.getElementById('bootretry').onclick=function(){ steadyHardReload(); };
window.__steadyBootTimer = setTimeout(function(){
  if (window.__steadyBooted) return;
  var r=document.querySelector('#boot .ring'), s=document.getElementById('bootsub'), f=document.getElementById('bootfail');
  if(r) r.hidden=true; if(s) s.hidden=true; if(f) f.hidden=false;
}, 20000);
</script>
<script type="module">
const src = '/steady-live/app.v3.js?b=80';
const clear = () => { const boot=document.getElementById('boot');
  if(boot){ boot.classList.add('gone'); setTimeout(()=>boot.remove(),350); } };
const fail = (e) => {
  window.__steadyBooted=true; clearTimeout(window.__steadyBootTimer);
  var r=document.querySelector('#boot .ring'), s=document.getElementById('bootsub'), f=document.getElementById('bootfail');
  if(r) r.hidden=true; if(s) s.hidden=true; if(f){ f.hidden=false;
    var p=f.querySelector('p'); if(p) p.textContent = 'Couldn\u2019t start: '+(e&&e.message||e||'unknown error')+'. Tap Try again.'; }
};
import(src).then(m => {
  try { m.bootSteady(); window.__steadyBooted=true; clearTimeout(window.__steadyBootTimer); clear();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/steady-live/sw.js');
  } catch (e) { fail(e); }
}).catch(fail);
</script>
</body>
</html>
